; ==============================================================================
; CLINICADB — CONFIGURACIÓN DE SUPERVISOR PARA WORKERS DE PRODUCCIÓN
; ==============================================================================
; Ubicación recomendada en el servidor: /etc/supervisor/conf.d/laravel-workers.conf
;
; NOTA: Reemplazar '/var/www/clinica' por la ruta absoluta de la aplicación en el servidor
; y 'www-data' por el usuario del sistema que ejecuta la aplicación web.
; ==============================================================================

; ------------------------------------------------------------------------------
; 1. WORKER DE COLA: default
; Tareas: Notificaciones por correo (citas, certificados médicos, órdenes y resultados
;         de laboratorio, recordatorios, transaccionales).
; Alta concurrencia, procesamiento rápido.
; ------------------------------------------------------------------------------
[program:laravel-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/clinica/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=60 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker-default.log
stopwaitsecs=65

; ------------------------------------------------------------------------------
; 2. WORKER DE COLA: media
; Tareas: Optimización y conversión de imágenes (WebP/AVIF), personalización de landing
;         y servicios de la clínica, limpieza de archivos multimedia reemplazados.
; Carga moderada, procesamiento computacional de imágenes.
; ------------------------------------------------------------------------------
[program:laravel-worker-media]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/clinica/artisan queue:work media --queue=media --sleep=3 --tries=3 --timeout=180 --max-time=3600 --max-jobs=500
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker-media.log
stopwaitsecs=190

; ------------------------------------------------------------------------------
; 3. WORKER DE COLA: backups
; Tareas: Generación de respaldos de base de datos completos (mysqldump), compresión,
;         cifrado AES-256-CBC, cálculo de hashes SHA-256 y carga a Cloudflare R2.
; Tarea pesada y de larga duración, aislada para evitar bloqueos en colas transaccionales.
; ------------------------------------------------------------------------------
[program:laravel-worker-backups]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/clinica/artisan queue:work database_backups --queue=backups --sleep=5 --tries=1 --timeout=1800 --max-time=7200 --max-jobs=100
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-worker-backups.log
stopwaitsecs=1810

; ------------------------------------------------------------------------------
; GRUPO DE PROCESOS
; Permite gestionar todos los workers conjuntamente con:
; supervisorctl status laravel-workers:*
; supervisorctl restart laravel-workers:*
; ------------------------------------------------------------------------------
[group:laravel-workers]
programs=laravel-worker-default,laravel-worker-media,laravel-worker-backups
